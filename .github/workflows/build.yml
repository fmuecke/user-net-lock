name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # build.ps1 initializes the x64 Visual Studio environment via vswhere.
      CC: cl
      CXX: cl

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        # Default CTest runs non-mutating tests; elevated WFP tests use Windows Sandbox.
        run: .\build.ps1 -Configuration Release -SkipFormatting

      - name: Bundle release artifact
        run: |
          $version = (Get-Item out/build/wfp-lock.exe).VersionInfo.ProductVersion
          if (-not $version) { throw 'The executable has no product version.' }
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match binary version v$version."
          }
          Compress-Archive -LiteralPath out/build/wfp-lock.exe, README.md, LICENSE, CHANGELOG.md `
            -DestinationPath "out/wfp-lock-v$version-win64.zip" -Force

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wfp-lock-msvc-x64-release
          path: out/wfp-lock-v*-win64.zip
          if-no-files-found: error

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wfp-lock-test-logs
          path: out/build/Testing/Temporary/
          if-no-files-found: ignore

  # Version tags publish the tested ZIP with notes from the matching CHANGELOG section.
  # Write permissions are limited to this job. Verify a ZIP or extracted executable with:
  #   gh attestation verify <file> -R fmuecke/wfp-lock
  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PACKAGE: wfp-lock-${{ github.ref_name }}-win64.zip
    steps:
      - name: Download release archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wfp-lock-msvc-x64-release
          path: dist

      - name: Unpack release archive
        run: |
          if [ ! -f "dist/$PACKAGE" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the built package"
            exit 1
          fi
          unzip -q "dist/$PACKAGE" -d package

      - name: Extract release notes
        run: |
          awk -v heading="## [${GITHUB_REF_NAME#v}]" \
            'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            package/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under '## [${GITHUB_REF_NAME#v}]'"
            exit 1
          fi
          printf '\nFull changelog: %s/%s/blob/%s/CHANGELOG.md\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.PACKAGE }}
            package/wfp-lock.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" "dist/$PACKAGE" --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md $prerelease
