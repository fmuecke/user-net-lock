name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MSVC x64 Release
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      # build.ps1 initializes the x64 Visual Studio environment via vswhere.
      CC: cl
      CXX: cl

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        # Default CTest runs non-mutating tests; elevated WFP tests use Windows Sandbox.
        run: .\build.ps1 -Configuration Release -SkipFormatting

      - name: Bundle release artifact
        run: |
          Compress-Archive -LiteralPath out/build/user-net-lock.exe, README.md, LICENSE, CHANGELOG.md `
            -DestinationPath out/user-net-lock-msvc-x64-release.zip -Force

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: user-net-lock-msvc-x64-release
          path: out/user-net-lock-msvc-x64-release.zip
          if-no-files-found: error

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: user-net-lock-test-logs
          path: out/build/Testing/Temporary/
          if-no-files-found: ignore
